services:
  api:
    ports: []

  worker:
    environment:
      CELERY_CONCURRENCY: "1"

  flower:
    profiles: ["monitoring"]
    ports: []

  beat:
    profiles: ["scheduled"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    image: company-docs-frontend:${IMAGE_TAG:-local}
    environment:
      APP_ADDRESS: ${APP_ADDRESS:-:80}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-80}:80"
    volumes:
      - ./frontend/Caddyfile.vps:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  caddy_data:
  caddy_config:
